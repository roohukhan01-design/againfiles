plugins {
    id 'com.android.application'
}
android {
    namespace 'com.roohu.clipforge'
    compileSdk 34
    defaultConfig {
        applicationId 'com.roohu.clipforge'
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName '3.1.0-m3'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
    packaging {
        resources { excludes += ['/META-INF/{AL2.0,LGPL2.1}', '/META-INF/DEPENDENCIES'] }
    }
}
// Keep the legacy Vosk dependency aligned with the Kotlin stdlib used by AndroidX/Media3.
// Kotlin 1.8 merged the JDK7/JDK8 extension classes into kotlin-stdlib; allowing
// Vosk's older 1.6.21 jdk8 artifact beside stdlib 1.8.22 causes duplicate-class errors.
configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.jetbrains.kotlin' &&
            details.requested.name in ['kotlin-stdlib', 'kotlin-stdlib-jdk7', 'kotlin-stdlib-jdk8']) {
            details.useVersion '1.8.22'
            details.because 'Align Kotlin standard-library artifacts to prevent duplicate classes.'
        }
    }
}

dependencies {
    implementation 'androidx.activity:activity:1.9.0'
    implementation 'androidx.webkit:webkit:1.11.0'
    // Hardware video rendering (trim, crop, effects, overlays, audio mixing)
    implementation 'androidx.media3:media3-common:1.4.1'
    implementation 'androidx.media3:media3-effect:1.4.1'
    implementation 'androidx.media3:media3-transformer:1.4.1'
    // Offline speech-to-text with word timestamps
    implementation 'net.java.dev.jna:jna:5.13.0@aar'
    implementation 'com.alphacephei:vosk-android:0.3.47'
}
